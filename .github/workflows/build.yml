name: Build Ghidra Allegrex

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra: [ '12.2' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Setup Ghidra
        uses: antoniovazquezblanco/setup-ghidra@021eb688b995b2c3aa4d607dea9cb332ab4eb9c8
        with:
          version: ${{ matrix.ghidra }}
      - name: Build Extension
        run: |
          chmod +x gradlew
          ./gradlew buildExtension
      - name: Verify mtvc masks and decompiled values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re, struct
          words = []
          for name, count in (("vfpu-control-transfers", 28), ("vfpu-mtvc-mask-edges", 7)):
              source = Path("src/test/fixtures", name + ".S").read_text()
              selected = [int(w, 16) for w in re.findall(r"^\s*\.word\s+(0x[0-9a-fA-F]{8})", source, re.M)]
              if len(selected) != count:
                  raise ValueError(f"Expected {count} instructions in {name}")
              words.extend(selected)
          Path(os.environ["RUNNER_TEMP"], "mtvc.bin").write_bytes(struct.pack("<35I", *words))
          PY
          unzip -q dist/*ghidra-allegrex.zip -d "$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
          mkdir -p "$RUNNER_TEMP/ghidra-control"
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-control" mtvc \
            -import "$RUNNER_TEMP/mtvc.bin" -loader BinaryLoader \
            -loader-baseAddr 0x08804000 -processor Allegrex:LE:32:default \
            -cspec default -noanalysis -scriptPath "$GITHUB_WORKSPACE/src/test/ghidra_scripts" \
            -postScript VfpuMtvcMaskSmoke.java -deleteProject 2>&1 | tee "$RUNNER_TEMP/mtvc.log"
          grep -q 'VFPU_MTVC_MASK_COMPLETE' "$RUNNER_TEMP/mtvc.log"
      - name: Preserve mtvc regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtvc-control-mask-Ghidra-${{ matrix.ghidra }}
          path: ${{ runner.temp }}/mtvc.log
          if-no-files-found: ignore
      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          path: dist/*ghidra-allegrex.zip
          name: ghidra-allegrex-snapshot-for-Ghidra-${{ matrix.ghidra }}
          if-no-files-found: error
      - name: Upload artifact to release
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ghidra-allegrex ${{ github.ref_name }}
          file: dist/*ghidra-allegrex.zip
          file_glob: true
          body: See [CHANGES](https://github.com/kotcrab/ghidra-allegrex/blob/master/CHANGES.md) file before updating.
          tag: ${{ github.ref }}
